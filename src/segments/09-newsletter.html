<section id="newsletter">
      <div class="container newsletter-grid">

        <div class="reveal">

          <div class="eyebrow">
            PetaLab Newsletter
          </div>

          <h2>
            See What Maps Can Reveal.
          </h2>

          <p class="mt-20">
            Research, spatial insights,
            maps, and stories from PetaLab.
          </p>

        </div>


        <div class="reveal reveal-delay-1">

          <form
            class="newsletter-form"
            action="#"
          >

            <input
              type="email"
              name="email"
              placeholder="Your email address"
              aria-label="Email address"
              required
            />

            <button type="submit">
              Subscribe →
            </button>

          </form>

        </div>

      </div>
    </section>
